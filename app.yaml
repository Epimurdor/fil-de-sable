kind: wasmer.io/App.v0
owner: sharsstech
name: fil-de-sable
package: .

# Base PostgreSQL managee : Wasmer injecte DB_HOST, DB_PORT, DB_NAME, DB_USERNAME, DB_PASSWORD
# (lus par src/lib/db.ts). Une seule region, compatible Postgres, en France.
capabilities:
  database:
    engine: postgres
locality:
  regions:
    - fr-roub1

# Variables non secretes. Les secrets (STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET) passent par
# `wasmer app secrets create`, jamais par ce fichier. APP_URL : URL publique (voir `wasmer app info`).
env:
  PAYMENT_PROVIDER: stripe

# Pas de bloc health_checks : la CLI Wasmer 7.5 rejette la syntaxe documentee
# ("invalid type: map, expected a Value::Tagged enum").
